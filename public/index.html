<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ご当地めし帖</title>
<link rel="stylesheet" href="/vendor/leaflet.css"><link rel="stylesheet" href="/style.css">
</head><body>
<div class="wrap">
  <header>
    <div>
      <h1>ご当地めし帖</h1>
      <p>都道府県と市区町村から、サーバーのみんなが勧める「うまい飯」を探せます。自分の推しの店も書き込めます。</p>
    </div>
    <div class="userbar" id="userbar"></div>
  </header>

  <div id="formSlot"></div>

  <div class="layout">
    <aside>
      <label class="favrow" id="favWrap" hidden><input type="checkbox" id="favOnly"> <span>お気に入りだけ表示（<span id="favCount">0</span>）</span></label>
      <div class="field">
        <label for="q">店名・コメントで検索</label>
        <input class="input" id="q" type="search" placeholder="例：味噌ラーメン">
      </div>
      <div>
        <h2>地方</h2>
        <div class="regions" id="regions"></div>
      </div>
      <div>
        <h2 id="prefHead">都道府県</h2>
        <div class="regions" id="prefs" style="margin-top:8px"></div>
      </div>
      <div class="field">
        <label for="city">市区町村（都道府県を選ぶと全件から選べます）</label>
        <select class="input" id="city"></select>
      </div>
      <div>
        <h2>ジャンル</h2>
        <div class="regions" id="genres" style="margin-top:8px"></div>
      </div>
      <div class="field">
        <label for="sort">並び順</label>
        <select class="input" id="sort">
          <option value="likes">おすすめ順（いいね数）</option>
          <option value="new">新着順</option>
        </select>
      </div>
    </aside>

    <main>
      <div class="crumb"><h2 id="title">全国のおすすめ</h2><small id="count"></small></div>
      <div class="viewtabs" role="group" aria-label="表示切替"><button class="chip" data-view="list" aria-pressed="true">一覧</button><button class="chip" data-view="map" aria-pressed="false">地図</button></div>
      <div id="map" class="map" hidden></div>
      <details class="export"><summary>Googleマイマップで見る（書き出し）</summary><div id="exportBody"></div></details>
      <div id="status" class="msg" role="status"></div>
      <div class="feed" id="feed"></div>
    </main>
  </div>
</div>

<script src="/vendor/leaflet.js"></script><script src="/genre.js"></script><script src="/app.js"></script>
</body></html>
